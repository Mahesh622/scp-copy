[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scp-select"
version = "1.0.0"
description = "Interactive TUI for selecting files to push to / pull from a server, with saved projects and live remote path autocomplete."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "mahesh622" }]
keywords = ["scp", "sftp", "ssh", "tui", "curses", "transfer", "file-picker"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: File Transfer",
]
dependencies = ["paramiko>=3.0.0"]

[project.urls]
Homepage = "https://github.com/mahesh622/scp-select"

[project.scripts]
scp-select = "scp_select:cli"

[tool.setuptools]
py-modules = ["scp_select"]
